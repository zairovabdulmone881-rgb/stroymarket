<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STROY LUXE — Премиальные материалы</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ШАПКА -->
  <header class="header">
    <div class="header-inner">
      <a href="#/" class="logo">STROY<span>LUXE</span></a>
      <div class="header-actions">
        <button class="cart-btn" id="cartBtn">
          🛒 <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="Поиск по каталогу..." />
    </div>
  </header>

  <!-- СЮДА ЗАГРУЖАЮТСЯ СТРАНИЦЫ (Главная, Каталог, Политика) -->
  <main id="app"></main>

  <!-- КОРЗИНА (Выезжает справа) -->
  <div class="overlay" id="overlay"></div>
  <aside class="cart" id="cart">
    <div class="cart-head">
      <h2>Ваша корзина</h2>
      <button id="closeCart">✕</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-foot">
      <div class="cart-total">Итого: <b id="cartTotal">0 ₽</b></div>
      <button class="btn-gold" id="checkoutBtn" style="width:100%; border:none;">Оформить заказ</button>
    </div>
  </aside>

  <!-- МОДАЛЬНОЕ ОКНО ОФОРМЛЕНИЯ ЗАКАЗА -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
      <h2>Оформление заказа</h2>
      <p style="margin-bottom: 15px; color: #aaa; font-size: 13px;">Оставьте контакты, и мы свяжемся с вами для подтверждения.</p>
      <form id="orderForm">
        <input type="text" id="orderName" placeholder="Ваше имя" required>
        <input type="tel" id="orderPhone" placeholder="Номер телефона" required>
        <button type="submit" class="btn-gold" style="width: 100%; margin-top: 10px;">Отправить заявку</button>
      </form>
      <button id="closeModal" class="close-modal">✕</button>
    </div>
  </div>

  <!-- УВЕДОМЛЕНИЯ -->
  <div class="toast" id="toast"></div>

  <!-- ПОДВАЛ (Ссылки на страницы) -->
  <footer class="footer">
    <div class="footer-links">
      <a href="#/">Главная</a>
      <a href="#/catalog">Каталог</a>
      <a href="#/delivery">Доставка и оплата</a>
      <a href="#/privacy">Политика конфиденциальности</a>
    </div>
    <p>© 2026 STROY LUXE. Премиальные решения для вашего дома.</p>
  </footer>

  <script src="app.js?v=10"></script>
</body>
</html>
