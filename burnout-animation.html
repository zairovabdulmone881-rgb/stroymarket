<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выгорание</title>
<style>
  :root { --bg1:#1a1a1a; --bg2:#2b2b2b; --gold:#e8c872; --gold2:#c9a24a; --gold3:#8a6d2b; --cream:#f3e6c4; --red:#d9573f; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:#000; overflow:hidden; font-family:"Segoe UI",system-ui,sans-serif; }
  body { display:grid; place-items:center; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; transform-origin:center;
           background:linear-gradient(170deg,var(--bg2),var(--bg1) 70%); color:var(--cream); }
  #world { position:absolute; inset:0; }
  .abs { position:absolute; }

  #cap { top:130px; left:70px; right:70px; text-align:center; font-size:72px; line-height:1.22; font-weight:800; color:var(--cream); min-height:2.6em; }
  .cur { display:inline-block; width:.08em; height:.9em; background:var(--gold); margin-left:6px; vertical-align:-.1em; animation:bl .7s steps(1) infinite; }
  @keyframes bl { 50% { opacity:0; } }

  #tabs { top:400px; left:150px; display:flex; gap:12px; }
  .tab { width:140px; height:68px; border-radius:16px; border:2px solid #4a4130; background:#1f1c16; color:#8d8165;
         display:grid; place-items:center; font-weight:800; font-size:30px; letter-spacing:2px; }
  .tab.past { border-color:var(--gold3); color:var(--gold3); }
  .tab.now  { background:linear-gradient(180deg,#f3d98a,#c9a24a); color:#1a1a1a; border-color:#f3d98a; box-shadow:0 0 36px rgba(232,200,114,.55); }

  #batt { left:190px; top:530px; width:700px; height:385px; filter:drop-shadow(0 0 30px rgba(232,200,114,.35)); }
  #pct  { top:925px; left:0; right:0; text-align:center; font-size:170px; font-weight:900; line-height:1; letter-spacing:4px; color:var(--gold); text-shadow:0 0 40px rgba(232,200,114,.4); }
  #pctl { top:1110px; left:0; right:0; text-align:center; font-size:30px; letter-spacing:10px; color:#8d8165; font-weight:700; }

  .notif { position:absolute; background:#201d17; border:2px solid #4a4130; border-left:8px solid var(--gold2); border-radius:18px;
           padding:16px 26px; font-size:34px; font-weight:700; color:var(--cream); opacity:0; white-space:nowrap; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .notif b { color:var(--gold); margin-left:10px; }

  #lamp { left:150px; top:1180px; width:780px; height:560px; border-radius:50%;
          background:radial-gradient(ellipse at center, rgba(232,200,114,.35), transparent 65%); }
  #char { left:390px; top:1260px; width:300px; height:300px; transform-origin:150px 290px; filter:drop-shadow(0 0 16px rgba(232,200,114,.4)); }
  .f { stroke:var(--gold); stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  #desktop { left:110px; top:1545px; width:860px; height:22px; background:linear-gradient(180deg,#e0b95a,#b08a34); border-radius:6px 6px 0 0; box-shadow:0 -4px 30px rgba(232,200,114,.2); }
  #deskbody { left:130px; top:1567px; width:820px; height:353px; background:linear-gradient(180deg,#25211a,#14120e); border:2px solid #3b3220; border-top:0; }

  #cta { inset:0; opacity:0; background:rgba(10,9,7,.86); z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 70px; }
  #cta svg { width:240px; height:240px; margin-bottom:50px; filter:drop-shadow(0 0 30px rgba(232,200,114,.5)); }
  #cta .h { font-size:88px; font-weight:900; line-height:1.15; color:var(--gold); text-shadow:0 0 30px rgba(232,200,114,.4); min-height:2.3em; }
  #cta .s { margin-top:40px; font-size:54px; font-weight:700; line-height:1.3; min-height:2.7em; }

  #bars { inset:0; z-index:18; pointer-events:none; }
  #bars div { position:absolute; left:0; right:0; mix-blend-mode:screen; display:none; }
  #fade { inset:0; background:#000; opacity:1; z-index:30; pointer-events:none; }
  #vig  { inset:0; z-index:20; pointer-events:none; background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7) 100%); }
  #grain{ inset:-50%; z-index:21; pointer-events:none; opacity:.09; mix-blend-mode:overlay;
          background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #ui { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:50; align-items:center; }
  #ui button { background:#2b2b2b; color:#e8e4dc; border:1px solid #444; border-radius:10px; padding:9px 16px; font-size:15px; cursor:pointer; }
  #time { color:#8d8a84; font:14px/1 monospace; min-width:84px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="cap" class="abs"></div>
    <div id="tabs" class="abs"></div>

    <svg id="batt" class="abs" viewBox="0 0 400 220">
      <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" id="g1" stop-color="#a98530"/><stop offset="1" id="g2" stop-color="#f3d98a"/></linearGradient>
      <clipPath id="bc"><rect id="bclip" x="26" y="36" width="308" height="148" rx="16"/></clipPath></defs>
      <rect x="10" y="20" width="340" height="180" rx="28" fill="#141210" stroke="#e8c872" stroke-width="10"/>
      <rect x="356" y="75" width="26" height="70" rx="8" fill="#e8c872"/>
      <rect x="26" y="36" width="308" height="148" rx="16" fill="url(#bg)" clip-path="url(#bc)" id="bfill"/>
      <g stroke="#141210" stroke-width="5"><line x1="87.6" y1="36" x2="87.6" y2="184"/><line x1="149.2" y1="36" x2="149.2" y2="184"/><line x1="210.8" y1="36" x2="210.8" y2="184"/><line x1="272.4" y1="36" x2="272.4" y2="184"/></g>
      <text id="warn" x="180" y="152" text-anchor="middle" font-size="110" font-weight="900" fill="#d9573f" opacity="0" font-family="Segoe UI,sans-serif">!</text>
    </svg>
    <div id="pct" class="abs">100%</div>
    <div id="pctl" class="abs">ЭНЕРГИЯ</div>

    <div id="notifs"></div>

    <div id="lamp" class="abs"></div>
    <div id="deskbody" class="abs"></div>
    <div id="char" class="abs"></div>
    <div id="desktop" class="abs"></div>
  </div>

  <div id="cta" class="abs">
    <svg viewBox="0 0 200 200"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d98a"/><stop offset="1" stop-color="#a98530"/></linearGradient></defs>
      <path d="M100 18C58 18 30 48 30 92c0 38 20 72 52 86 6 3 12 3 18 3s12 0 18-3c32-14 52-48 52-86 0-44-28-74-70-74z" fill="url(#mg)"/>
      <path d="M52 86q18-18 34 0q-17 12-34 0zM114 86q18-18 34 0q-17 12-34 0z" fill="#1a1a1a"/>
      <path d="M70 134q30 22 60 0" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round"/></svg>
    <div class="h" id="ctaH"></div><div class="s" id="ctaS"></div>
  </div>
  <div id="bars" class="abs"></div>
  <div id="fade" class="abs"></div><div id="vig" class="abs"></div><div id="grain" class="abs"></div>
</div>
<div id="ui"><button id="replay">↻ Заново</button><button id="pause">❚❚ Пауза</button><span id="time"></span></div>

<script>
/* ================== НАСТРОЙКИ ================== */
const CFG = {
  duration: 15, loop: true,
  days: ['ПН','ВТ','СР','ЧТ','ПТ'],
  // уровень энергии: [время, %] — между точками плавно
  energy: [[0,100],[3.0,100],[4.0,58],[5.0,34],[6.0,14],[6.7,8],[6.8,0]],
  crash: [6.75, 7.05], blackout: [7.05, 7.4],
  caps: [
    { from:.15,  to:2.95, cps:22, text:'Понедельник: я полон сил!' },
    { from:3.2,  to:6.9,  cps:19, text:'Работа. Дедлайны. Чаты. Ещё чуть-чуть…' },
    { from:7.6,  to:10.9, cps:16, text:'Ты не ленивый.\nТы выгорел.' }
  ],
  notifs: [
    { t:3.3, x:70,  y:1010, r:-4, a:'Почта', b:'47' },   { t:3.8, x:520, y:1060, r:3,  a:'Чат', b:'128' },
    { t:4.3, x:110, y:1125, r:2,  a:'Дедлайн', b:'завтра' }, { t:4.8, x:560, y:1170, r:-3, a:'Созвон', b:'18:00' },
    { t:5.3, x:40,  y:1215, r:4,  a:'Ещё один отчёт', b:'' }, { t:5.8, x:500, y:1010, r:-2, a:'«Срочно!!!»', b:'' },
    { t:6.2, x:240, y:1075, r:3,  a:'Чат', b:'289' }
  ],
  cta: { head:'На сколько % твоя батарейка?', sub:'Напиши цифру в комментариях 👇', at:11.0 }
};

/* ================== ХЕЛПЕРЫ ================== */
const $ = id => document.getElementById(id);
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease = x=>x*x*(3-2*x);
function typed(text, start, cps, t, cursor){
  const n = clamp(Math.floor((t-start)*cps), 0, text.length);
  const shown = t<start ? '' : text.slice(0,n);
  return (shown + `<span style="visibility:hidden">${text.slice(n)}</span>` + (cursor ? '<span class="cur"></span>' : '')).replace(/\n/g,'<br>');
}
function energyAt(t){
  const e = CFG.energy;
  for (let i=1;i<e.length;i++) if (t<=e[i][0]) { const [t0,v0]=e[i-1],[t1,v1]=e[i]; return v0 + (v1-v0)*ease(clamp((t-t0)/(t1-t0))); }
  return e[e.length-1][1];
}

/* ================== ПЕРСОНАЖ ================== */
const FACES = {
  bright: `<circle cx="128" cy="150" r="13" fill="#e8c872"/><circle cx="172" cy="150" r="13" fill="#e8c872"/><path class="f" d="M134 182q16 14 32 0"/>`,
  tired:  `<path d="M114 150q14-14 28 0z" fill="#e8c872"/><path d="M158 150q14-14 28 0z" fill="#e8c872"/><path class="f" d="M114 150h28M158 150h28"/><path class="f" d="M140 184h20"/>`,
  droop:  `<path class="f" d="M112 152q16 12 32 0M156 152q16 12 32 0"/><path class="f" d="M116 166q12 6 24 0M160 166q12 6 24 0" opacity=".5"/><path class="f" d="M138 188q12-6 24 0"/>`,
  dead:   `<path class="f" d="M114 150l28 12M114 162l28-12M158 150l28 12M158 162l28-12"/><path class="f" d="M138 190h24"/>`
};
$('char').innerHTML = `<svg viewBox="0 0 300 300" width="300" height="300">
  <g stroke="#e8c872" stroke-width="5" fill="#0b0b0b" stroke-linejoin="round" id="spikes">
    <polygon points="116,100 126,58 140,94"/><polygon points="138,92 150,46 162,92"/><polygon points="160,94 174,58 184,100"/></g>
  <path d="M96 296Q96 216 150 212Q204 216 204 296Z" fill="#0b0b0b" stroke="#e8c872" stroke-width="4"/>
  <circle cx="150" cy="150" r="64" fill="#0b0b0b" stroke="#e8c872" stroke-width="5"/>
  <g id="face"></g>
  <rect x="66" y="244" width="168" height="54" rx="7" fill="#d9c9a0"/><circle cx="150" cy="271" r="5" fill="#b7a577"/></svg>`;
let lastFace = null;

/* ================== УВЕДОМЛЕНИЯ, ВКЛАДКИ, ГЛИТЧ ================== */
const nEls = CFG.notifs.map(n=>{ const d=document.createElement('div'); d.className='notif';
  d.style.left=n.x+'px'; d.style.top=n.y+'px'; d.innerHTML = n.a + (n.b?`<b>${n.b}</b>`:''); $('notifs').appendChild(d); return d; });
const tabs = CFG.days.map(d=>{ const e=document.createElement('div'); e.className='tab'; e.textContent=d; $('tabs').appendChild(e); return e; });
const world=$('world'), bars=$('bars'); for(let i=0;i<7;i++) bars.appendChild(document.createElement('div'));
function glitch(on){
  if(!on){ world.style.transform=''; world.style.filter=''; for(const b of bars.children) b.style.display='none'; return; }
  const sx=6+Math.random()*16;
  world.style.transform=`translate(${(Math.random()-.5)*70}px,${(Math.random()-.5)*16}px) skewX(${(Math.random()-.5)*7}deg)`;
  world.style.filter=`drop-shadow(${sx}px 0 0 rgba(255,0,60,.75)) drop-shadow(${-sx}px 0 0 rgba(0,255,255,.7)) contrast(${1.1+Math.random()*.5}) hue-rotate(${(Math.random()-.5)*50}deg)`;
  for(const b of bars.children){ const s=Math.random()>.35; b.style.display=s?'block':'none'; if(!s) continue;
    b.style.top=Math.random()*1920+'px'; b.style.height=(8+Math.random()*110)+'px';
    b.style.background=['rgba(255,0,60,.22)','rgba(0,255,255,.2)','rgba(255,255,255,.14)'][Math.floor(Math.random()*3)];
    b.style.transform=`translateX(${(Math.random()-.5)*160}px)`; }
}

/* ================== ТАЙМЛАЙН ================== */
function render(t){
  const D = CFG, dead = t >= D.crash[0];
  const p = energyAt(t);                       // 0..100
  const lowCol = p < 25;

  // батарея
  const w = 308*p/100;
  $('bclip').setAttribute('width', Math.max(0,w));
  $('g1').setAttribute('stop-color', lowCol ? '#8f2f20' : '#a98530');
  $('g2').setAttribute('stop-color', lowCol ? '#e0694f' : '#f3d98a');
  const blink = lowCol && Math.floor(t*4)%2===0;
  $('warn').setAttribute('opacity', p<=0 ? (Math.floor(t*2.5)%2===0 ? 1 : .15) : 0);
  $('batt').style.opacity = p<=0 ? 1 : (blink ? .72 : 1);
  $('pct').textContent = Math.round(p)+'%';
  $('pct').style.color = lowCol ? '#e0694f' : '#e8c872';

  // подпись по буквам
  const seg = D.caps.find(c=>t>=c.from && t<c.to+.3);
  if (seg){ $('cap').innerHTML = typed(seg.text, seg.from, seg.cps, t, t-seg.from < seg.text.length/seg.cps+1.2);
            $('cap').style.opacity = 1 - ease(clamp((t-(seg.to-.1))/.35)); }
  else $('cap').style.opacity = 0;

  // вкладки дней
  const di = t<3 ? 0 : clamp(1+Math.floor(t-3), 0, 4);
  tabs.forEach((e,i)=>{ e.className='tab'+(i<di?' past':i===di?' now':''); });
  $('tabs').style.opacity = 1-ease(clamp((t-6.75)/.3));

  // уведомления: вылетают, к краху пропадают
  CFG.notifs.forEach((n,i)=>{
    const a = ease(clamp((t-n.t)/.3)), out = t>=D.crash[0] ? 0 : 1;
    nEls[i].style.opacity = a*out;
    nEls[i].style.transform = `rotate(${n.r}deg) translateY(${(1-a)*40}px) scale(${.9+.1*a})`;
  });

  // персонаж и лампа
  const face = p>70 ? 'bright' : p>35 ? 'tired' : p>5 ? 'droop' : 'dead';
  if (face!==lastFace){ $('face').innerHTML = FACES[face]; lastFace=face; }
  const tilt = (1-p/100)*14;
  const slump = ease(clamp((t-7.4)/.8));
  const bob = Math.sin(t*(p>70?5:2))*(p>70?5:2);
  $('char').style.transform = `translateY(${bob + slump*45}px) rotate(${tilt + slump*22}deg)`;
  const flick = p<30 && !dead ? .55+.45*Math.sin(t*37)*Math.sin(t*11) : 1;
  $('lamp').style.opacity = dead ? (t<7.4?0:.09) : (.25 + .75*p/100)*flick;

  // глитч и «чёрный экран» после краха
  glitch(t>=D.crash[0] && t<D.crash[1] || (t>=3.0 && t<3.1) || (t>=6.0 && t<6.08));
  const black = (t>=D.blackout[0] && t<D.blackout[1]) ? 1 : 0;
  $('fade').style.opacity = Math.max(black, 1-ease(clamp(t/.4)), ease(clamp((t-(D.duration-.5))/.5)));

  // финальный CTA
  const c = D.cta;
  $('cta').style.opacity = ease(clamp((t-c.at)/.7));
  $('ctaH').innerHTML = typed(c.head, c.at+.9, 17, t, t<c.at+.9+c.head.length/17);
  $('ctaS').innerHTML = typed(c.sub,  c.at+2.9, 20, t, t>=c.at+2.9);
  $('time').textContent = t.toFixed(1)+' / '+D.duration+' с';
}

/* ================== ПЛЕЕР ================== */
let t0=performance.now(), offset=0, paused=null, cur=0;
function loop(now){ if(paused===null){ let t=(now-t0)/1000+offset; if(t>=CFG.duration){ if(CFG.loop){t0=now;offset=0;t=0;} else t=CFG.duration; } cur=t; render(t); } requestAnimationFrame(loop); }
$('replay').onclick=()=>{ t0=performance.now(); offset=0; paused=null; $('pause').textContent='❚❚ Пауза'; };
$('pause').onclick=()=>{ if(paused===null){ paused=cur; $('pause').textContent='▶ Играть'; } else { offset=paused; t0=performance.now(); paused=null; $('pause').textContent='❚❚ Пауза'; } };
window.seek = s => { paused=s; cur=s; render(s); };
function fit(){ const s=Math.min(innerWidth/1080,(innerHeight-50)/1920), st=$('stage'); st.style.transform=`scale(${s})`; st.style.margin=`${-(1920*(1-s))/2}px ${-(1080*(1-s))/2}px`; }
addEventListener('resize',fit); fit(); requestAnimationFrame(loop);
</script>
</body>
</html>
