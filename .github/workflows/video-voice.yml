name: Озвучка роликов (Дмитрий)

# Записывает недостающие voice/NN.mp3 для всех выпусков и кладёт их в ту же ветку.
on:
  workflow_dispatch:
  push:
    paths:
      - video/episodes/*/lines.json
      - video/tools/tts.py
      - .github/workflows/video-voice.yml

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python video/tools/tts.py
      - name: Сохранить аудио в ветку
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/episodes
          git diff --cached --quiet || git commit -m "Add voiceover audio"
          git push
