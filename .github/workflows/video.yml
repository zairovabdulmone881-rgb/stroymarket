# Серия «100 сподвижников»: сверка хадисов → озвучка каждого кадра → запись mp4.
# Запускается при изменении episode.js или вручную (Actions → Video → Run workflow).
# Озвучка (voice/NN.mp3 и timing.js) коммитится обратно в папку выпуска,
# готовые mp4 лежат в артефактах запуска.
name: Video

on:
  push:
    paths: ["video/episodes/**/episode.js"]
  workflow_dispatch:
    inputs:
      episodes:
        description: "Папки выпусков через пробел (например 001-abu-bakr-as-siddiq) или all"
        required: true
        default: "all"
      render:
        description: "Записывать mp4"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Какие выпуски
        id: eps
        env:
          INPUT: ${{ github.event.inputs.episodes }}
        run: |
          ALL=$(ls episodes | tr '\n' ' ')
          if [ -n "$INPUT" ] && [ "$INPUT" != "all" ]; then RENDER="$INPUT"; elif [ -n "$INPUT" ]; then RENDER="$ALL"; else RENDER=""; fi
          echo "list=$ALL" >> "$GITHUB_OUTPUT"
          echo "render=$RENDER" >> "$GITHUB_OUTPUT"
          echo "Все выпуски: $ALL"; echo "Записать по запросу: $RENDER"

      - uses: actions/setup-python@v5
        if: steps.eps.outputs.list != ''
        with: { python-version: "3.12" }

      - uses: actions/setup-node@v4
        if: steps.eps.outputs.list != ''
        with: { node-version: "20" }

      - name: Установка
        if: steps.eps.outputs.list != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Сверка хадисов и аятов
        if: steps.eps.outputs.list != ''
        run: |
          for e in ${{ steps.eps.outputs.list }}; do python3 tools/hadith.py verify "episodes/$e/episode.js"; done

      - name: Озвучка
        id: voice
        if: steps.eps.outputs.list != ''
        run: |
          # Озвучиваются только новые или изменённые кадры; выпуски с обновлённой озвучкой записываются в mp4
          export UPDATED_LIST="$RUNNER_TEMP/updated.txt"; touch "$UPDATED_LIST"
          rc=0
          for e in ${{ steps.eps.outputs.list }}; do python3 tools/voice.py "episodes/$e" || rc=1; done
          exit $rc

      - name: Сохранить озвучку в репозиторий
        if: always() && steps.eps.outputs.list != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/*/voice; git add episodes/*/timing.js 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Озвучка выпусков: ${{ steps.eps.outputs.list }} [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break || sleep $((i*5)); done

      - name: Запись mp4
        if: always() && steps.eps.outputs.list != '' && github.event.inputs.render != 'false'
        run: |
          LIST=$(echo ${{ steps.eps.outputs.render }} $(cat "$RUNNER_TEMP/updated.txt" 2>/dev/null) | tr ' ' '\n' | sort -u)
          echo "Записываю: $LIST"
          for e in $LIST; do [ -f "episodes/$e/timing.js" ] && node tools/render.js 3-kino "$e" "out/$e.mp4"; done
          ls out/*.mp4 >/dev/null 2>&1 || echo "нечего записывать"

      - uses: actions/upload-artifact@v4
        if: always() && steps.eps.outputs.list != '' && github.event.inputs.render != 'false'
        with:
          name: video
          path: video/out/*.mp4
          retention-days: 30
          if-no-files-found: ignore
